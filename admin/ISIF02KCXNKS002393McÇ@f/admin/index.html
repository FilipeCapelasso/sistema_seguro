<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#11161d">
<title>Recuperação de Seguros — Star Motos</title>
<link rel="icon" href="/assets/icone.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icone-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/icone-180.png">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main class="login">
  <div class="card">
    <div class="logo"><i></i> Star Motos · Seguros</div>
    <div id="carregando" class="carregando">Carregando…</div>

    <form id="f-login" class="oculto" autocomplete="on" novalidate>
      <h1>Entrar</h1>
      <label class="campo"><span>E-mail</span><input id="l-email" type="email" autocomplete="username" inputmode="email" required></label>
      <label class="campo"><span>Senha</span><input id="l-senha" type="password" autocomplete="current-password" required></label>
      <div id="l-erro" class="aviso erro oculto" role="alert"></div>
      <button class="btn pri" style="width:100%" type="submit">Entrar</button>
      <p class="peq mut cen" id="l-primeiro-wrap" style="margin-top:1rem"></p>
    </form>

    <form id="f-primeiro" class="oculto" autocomplete="off" novalidate>
      <h1>Primeiro acesso</h1>
      <p class="mut peq">Crie o administrador do sistema. Use o código de primeiro acesso entregue na implantação. Ele só funciona uma vez.</p>
      <label class="campo"><span>Código de primeiro acesso</span><input id="p-codigo" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
      <label class="campo"><span>Seu nome</span><input id="p-nome" type="text" autocomplete="name" required></label>
      <label class="campo"><span>E-mail</span><input id="p-email" type="email" autocomplete="off" inputmode="email" required></label>
      <label class="campo"><span>Senha (mínimo 10 caracteres, com letras e números)</span><input id="p-senha" type="password" autocomplete="new-password" required></label>
      <div id="p-erro" class="aviso erro oculto" role="alert"></div>
      <button class="btn pri" style="width:100%" type="submit">Criar administrador</button>
      <p class="peq cen" style="margin-top:1rem"><a href="#" id="p-voltar">Voltar ao login</a></p>
    </form>

    <div id="sem-acesso" class="oculto">
      <h1>Sem acesso</h1>
      <p>Sua conta não tem acesso a este sistema. Peça ao administrador para cadastrar você.</p>
      <button class="btn" id="b-sair" style="width:100%">Sair</button>
    </div>
  </div>
</main>

<script src="/assets/vendor/supabase.js"></script>
<script type="module" src="/assets/entrada.js"></script>
</body>
</html>
