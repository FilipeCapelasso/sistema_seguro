<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#11161d">
<title>Enviar cotação — Star Motos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 22%27%3E%3Crect width=%2710%27 height=%2722%27 rx=%272%27 fill=%27%23c8102e%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topo"><div class="marca"><i></i> Star Motos · Seguros</div></header>

<main class="envio">
  <section class="passo card">
    <h2><b>1</b> Anexe as cotações</h2>
    <div id="zona" class="zona" tabindex="0" role="button" aria-label="Escolher arquivos das cotações">
      <div class="ico" aria-hidden="true">📎</div>
      <strong>Toque para escolher as cotações</strong>
      <span class="mut peq">Fotos (JPG, PNG) ou PDF · pode escolher vários de uma vez</span>
    </div>
    <input id="arquivo" class="sr" type="file" multiple accept="image/jpeg,image/png,application/pdf" tabindex="-1">
    <input id="foto" class="sr" type="file" accept="image/*" capture="environment" tabindex="-1">
    <p class="cen" style="margin:.75rem 0 0"><button type="button" class="btn" id="b-foto">📷 Tirar foto agora</button></p>
    <div id="erro1" class="aviso erro oculto" role="alert"></div>
  </section>

  <section class="passo card oculto" id="fila-card">
    <h2><b>2</b> Por que não fechou?</h2>
    <p class="mut peq" style="margin:.2rem 0 .6rem">Marque todas de uma vez ou escolha em cada cotação.</p>
    <div class="motivos" id="todos" role="group" aria-label="Marcar todas"></div>
    <ul class="hist" id="fila" style="margin-top:1rem"></ul>
    <div id="erro2" class="aviso erro oculto" role="alert"></div>
  </section>

  <section class="passo oculto" id="envia-card">
    <button type="button" class="btn pri btn-enviar" id="enviar">ENVIAR</button>
    <div id="resumo" class="peq cen" style="margin-top:.6rem" aria-live="polite"></div>
  </section>
</main>

<script type="module" src="/assets/publico.js"></script>
</body>
</html>
